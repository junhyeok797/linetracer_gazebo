ekf_odom:
  ros__parameters:
    system:
      loop_rate: 20.0 # [Hz]
      use_sim_time: false
    
    model:
      wheel_radius: 0.033
      wheel_separation: 0.287
      imu_yaw_offset: 0.0
    
    tf:
      publish_tf: false
      frame_id: "odom"
      child_frame_id: "base_footprint"

    ekf:
      initial_covariance:
        diagonal: [0.5, 0.5, 0.05, 0.1, 0.1]
      process_noise:
        q_x: 0.05
        q_y: 0.05
        q_theta: 0.01
        q_v: 0.1
        q_w: 0.05
      measurement_noise:
        r_theta: 0.02
        r_w: 0.02